robot: colmibot

cad:
  unidades: mm          # unidades de las STL que exporta SolidWorks
  frente: "-z"          # que eje del CAD apunta al FRENTE del robot
  arriba: "y"           # que eje del CAD apunta ARRIBA

# Densidades en kg/m3. Se usan para calcular masa e inercia desde el volumen
# de cada malla. Ajustar si se conoce el material real de alguna pieza.
materiales:
  pla: 1240
  abs: 1040
  aluminio: 2700
  acrilico: 1180
  pcb: 1850
  hule: 1100
  liion: 2600          # densidad aparente de una celda 18650
  generico: 1000

# Decimado de mallas visuales: numero maximo de triangulos por modulo.
# Las mallas de colision NO usan malla, usan primitivas (ver 'colision').
decimado_max_caras: 4000

# Descartar solidos sueltos menores a este volumen (mm3). Los modelos de CAD de
# tarjetas comerciales traen cientos de pines y tornillos que no cambian como se
# ve la pieza pero cuestan decenas de miles de triangulos. Subir el numero quita
# mas detalle; ponerlo en 0 lo conserva todo.
descartar_menores_mm3: 30

modulos:

  # ---- Chasis -------------------------------------------------------------
  base:
    patrones: ["CLM-Base-2", "CLM-Body-1", "CLM-Plato-1", "PosteM3x"]
    material: acrilico
    padre: null                 # raiz del arbol
    colision: caja

  ruedas_locas:
    patrones: ["RuedaLoca", "Separador_Rue_Loca"]
    material: pla
    padre: base
    junta: fixed
    colision: caja

  interruptores:
    patrones: ["CLM-KCD1"]      # 2 switches basculantes, segun el BOM
    material: abs
    padre: base
    junta: fixed
    colision: caja

  # ---- Traccion -----------------------------------------------------------
  # Las llantas cuelgan de base_link, no del motor. Es lo estandar en un
  # diferencial: el controlador necesita la separacion entre ruedas respecto
  # al chasis, y encadenar bracket->motor->llanta la vuelve indirecta.
  # Los brackets y motores quedan como eslabones visuales fijos a la base.
  bracket_der:
    patrones: ["BracketsPololu37D-2"]
    material: aluminio
    padre: base
    junta: fixed
    colision: caja

  bracket_izq:
    patrones: ["BracketsPololu37D-3"]
    material: aluminio
    padre: base
    junta: fixed
    colision: caja

  motor_der:
    patrones: ["Motorreductor 37D con encoder-1"]
    material: aluminio
    # masa_g: 215        # <- descomentar con el dato real del Pololu 37D
    padre: base
    junta: fixed
    colision: caja

  motor_izq:
    patrones: ["Motorreductor 37D con encoder-2"]
    material: aluminio
    # masa_g: 215
    padre: base
    junta: fixed
    colision: caja

  llanta_der:
    patrones: ["Llanta60mmD-2"]
    material: hule
    padre: base
    junta: continuous
    eje: [0, 1, 0]              # gira sobre Y (REP-103)
    colision: cilindro
    cilindro_eje: y

  llanta_izq:
    patrones: ["Llanta60mmD-1"]
    material: hule
    padre: base
    junta: continuous
    eje: [0, 1, 0]
    colision: cilindro
    cilindro_eje: y

  # ---- Energia ------------------------------------------------------------
  bateria:
    patrones: ["EnsBat3S1P", "Holder18650"]
    material: liion
    padre: base
    junta: fixed
    colision: caja

  # ---- Electronica --------------------------------------------------------
  electronica_control:
    patrones: ["ESP32_Wroom", "ExpansionBoardESP32", "ShieldESP32",
               "Cytron_MDD10A", "StepUp_XL4015"]
    material: pcb
    # masa_g: 120        # <- pesar el conjunto de tarjetas
    padre: base
    junta: fixed
    colision: caja

  raspi5:
    patrones: ["RasPi5-1", "PI5_CaseBase", "PI5_CaseTop"]
    material: pcb
    # masa_g: 90         # <- Pi 5 + carcasa
    padre: base
    junta: fixed
    colision: caja

  cooler:
    patrones: ["RasPi5_Cooler"]
    material: abs
    padre: raspi5
    junta: fixed
    colision: caja

  # ---- Sensores -----------------------------------------------------------
  imu:
    patrones: ["IMU_BMI270"]
    material: pcb
    padre: base
    junta: fixed
    colision: caja

  soporte_tof:
    patrones: ["Holder3TOF"]
    material: pla
    padre: base
    junta: fixed
    colision: caja

  tof_1:
    patrones: ["VL53L1XV2-1"]
    material: pcb
    padre: soporte_tof
    junta: fixed
    colision: caja
    sensor: tof                 # calcula la direccion de medicion desde la malla

  tof_2:
    patrones: ["VL53L1XV2-2"]
    material: pcb
    padre: soporte_tof
    junta: fixed
    colision: caja
    sensor: tof

  tof_3:
    patrones: ["VL53L1XV2-3"]
    material: pcb
    padre: soporte_tof
    junta: fixed
    colision: caja
    sensor: tof

  # ---- Camara -------------------------------------------------------------
  montaje_camara:
    patrones: ["PisoCam", "BaseCam"]
    material: pla
    padre: base
    junta: fixed
    colision: caja

  camara:
    patrones: ["LogitechC920Montaj"]
    material: abs
    padre: montaje_camara
    junta: fixed
    colision: caja
    sensor: camara              # agrega tambien el frame optico (REP-103)
